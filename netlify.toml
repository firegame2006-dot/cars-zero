# Статичний сайт без збірки — Netlify роздає файли з кореня репозиторію.
[build]
  publish = "."
  command = ""

# Базові заголовки безпеки для всього сайту.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Сторінки ніколи не кешуємо: правки мають бути видні одразу після деплою.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Запасний каталог тягнеться без версії в адресі — теж не кешуємо.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Усі посилання на стилі, скрипти, фото й відео мають ?v= — його проставляє
# tools/bump_assets.py, і після кожного деплою адреса змінюється. Тому файли
# можна кешувати надовго: повторні візити не роблять жодного запиту замість
# перевірки кожного з двох десятків файлів.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/video/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Службові файли потрібні лише для локальної роботи (server.py, скрипти,
# README, запасні дані). У репозиторії вони мають лишатися, але з інтернету
# їх віддавати не треба — сайт бачать клієнти.
[[redirects]]
  from = "/server.py"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tools/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/data/cars.seed.json"
  to = "/404.html"
  status = 404
  force = true
