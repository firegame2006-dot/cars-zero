<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-doc="meta.about">Про нас — Velora Motors</title>
<meta name="description" data-i18n-doc="page.aboutLead" content="Про автосалон Velora Motors">
<meta name="theme-color" content="#fcfaf6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%239c6b33'/><text x='16' y='21' font-size='15' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23fff'>V</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<main>
  <section class="pagehead">
    <div class="wrap">
      <nav class="crumbs">
        <a href="index.html" data-i18n="nav.home"></a>
        <span>/</span>
        <span data-i18n="nav.about"></span>
      </nav>
      <span class="eyebrow" data-i18n="about.eyebrow"></span>
      <h1 class="pagehead__title" data-i18n="about.title"></h1>
      <p class="lead" data-i18n="page.aboutLead"></p>
    </div>
  </section>

  <section class="section section--flat">
    <div class="wrap">
      <div class="about__hero reveal">
        <div class="about__hero-media">
          <img src="assets/img/cars/mercedes-s-class-2.jpg" alt="Velora Motors" loading="lazy">
        </div>
        <div class="about__hero-text">
          <p class="lead" data-i18n="footer.about"></p>
          <p class="demo-note"><svg><use href="#i-info"/></svg><span data-i18n="demo.note"></span></p>
          <div class="about__actions">
            <a class="btn btn--primary" href="catalog.html" data-i18n="nav.catalog"></a>
            <a class="btn btn--ghost" href="contacts.html" data-i18n="nav.contacts"></a>
          </div>
        </div>
      </div>

      <div class="about__grid reveal">
        <article class="about__card">
          <div class="about__num">01</div>
          <h3 data-i18n="about.a1t"></h3>
          <p data-i18n="about.a1d"></p>
        </article>
        <article class="about__card">
          <div class="about__num">02</div>
          <h3 data-i18n="about.a2t"></h3>
          <p data-i18n="about.a2d"></p>
        </article>
        <article class="about__card">
          <div class="about__num">03</div>
          <h3 data-i18n="about.a3t"></h3>
          <p data-i18n="about.a3d"></p>
        </article>
        <article class="about__card">
          <div class="about__num">04</div>
          <h3 data-i18n="about.a4t"></h3>
          <p data-i18n="about.a4d"></p>
        </article>
      </div>

      <div class="figures reveal">
        <div class="figure">
          <div class="figure__value">12<span>+</span></div>
          <div class="figure__label" data-i18n="about.y1"></div>
        </div>
        <div class="figure">
          <div class="figure__value">4200<span>+</span></div>
          <div class="figure__label" data-i18n="about.y2"></div>
        </div>
        <div class="figure">
          <div class="figure__value">980<span>+</span></div>
          <div class="figure__label" data-i18n="about.y3"></div>
        </div>
        <div class="figure">
          <div class="figure__value">64</div>
          <div class="figure__label" data-i18n="about.y4"></div>
        </div>
      </div>
    </div>
  </section>

  <section class="ctaband">
    <div class="wrap">
      <div class="ctaband__inner reveal">
        <div>
          <h2 data-i18n="cta.title"></h2>
          <p data-i18n="cta.lead"></p>
        </div>
        <div class="ctaband__actions">
          <a class="btn btn--accent" href="service.html" data-i18n="cta.button"></a>
          <button class="btn btn--light" data-demo="phone" data-i18n="cta.secondary"></button>
        </div>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    I18N.init();
    Layout.mount('about');
    I18N.applyDom();
    Layout.reveal();
    document.addEventListener('layout:lang', function () { I18N.applyDom(); });
  });
</script>
</body>
</html>
