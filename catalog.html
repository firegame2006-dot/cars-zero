<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-doc="meta.catalog">Каталог авто — Velora Motors</title>
<meta name="description" data-i18n-doc="page.catalogLead" content="Каталог автомобілів Velora Motors">
<meta name="theme-color" content="#fcfaf6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%239c6b33'/><text x='16' y='21' font-size='15' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23fff'>V</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<main>
  <section class="pagehead">
    <div class="wrap">
      <nav class="crumbs">
        <a href="index.html" data-i18n="nav.home"></a>
        <span>/</span>
        <span data-i18n="nav.catalog"></span>
      </nav>
      <span class="eyebrow" data-i18n="catalog.eyebrow"></span>
      <h1 class="pagehead__title" data-i18n="catalog.title"></h1>
      <p class="lead" data-i18n="page.catalogLead"></p>
    </div>
  </section>

  <section class="section section--flat" id="catalogTop">
    <div class="wrap">
      <div class="searchpanel">
        <div class="searchpanel__main">
          <div class="searchinput" id="searchWrap">
            <svg><use href="#i-search"/></svg>
            <input type="search" id="q" autocomplete="off" spellcheck="false"
                   data-i18n-placeholder="catalog.searchPh" data-i18n-aria="catalog.searchLabel">
            <button class="searchinput__clear" id="qClear" type="button" data-i18n-aria="catalog.clear">
              <svg width="13" height="13"><use href="#i-x"/></svg>
            </button>
            <div class="suggest" id="suggest" role="listbox"></div>
          </div>

          <div class="select select--sort">
            <label for="sort" data-i18n="catalog.sort"></label>
            <select id="sort"></select>
            <svg class="select__caret"><use href="#i-chev-down"/></svg>
          </div>
        </div>

        <button class="filters__toggle" id="filtersToggle" type="button" aria-expanded="false">
          <svg><use href="#i-filter"/></svg>
          <span data-i18n="catalog.filters"></span>
          <span class="filters__count" id="filtersCount" hidden></span>
        </button>

        <div class="filters" id="filters">
          <div class="select">
            <label for="fBrand" data-i18n="catalog.brand"></label>
            <select id="fBrand"></select><svg class="select__caret"><use href="#i-chev-down"/></svg>
          </div>
          <div class="select">
            <label for="fBody" data-i18n="catalog.body"></label>
            <select id="fBody"></select><svg class="select__caret"><use href="#i-chev-down"/></svg>
          </div>
          <div class="select">
            <label for="fFuel" data-i18n="catalog.fuel"></label>
            <select id="fFuel"></select><svg class="select__caret"><use href="#i-chev-down"/></svg>
          </div>
          <div class="select">
            <label for="fGearbox" data-i18n="catalog.gearbox"></label>
            <select id="fGearbox"></select><svg class="select__caret"><use href="#i-chev-down"/></svg>
          </div>
          <div class="select">
            <label for="fDrive" data-i18n="catalog.drive"></label>
            <select id="fDrive"></select><svg class="select__caret"><use href="#i-chev-down"/></svg>
          </div>
          <div class="select">
            <label for="fCondition" data-i18n="catalog.condition"></label>
            <select id="fCondition"></select><svg class="select__caret"><use href="#i-chev-down"/></svg>
          </div>
          <div class="select">
            <label for="fCity" data-i18n="hero.city"></label>
            <select id="fCity"></select><svg class="select__caret"><use href="#i-chev-down"/></svg>
          </div>
          <div class="select">
            <label for="fYear" data-i18n="catalog.yearFrom"></label>
            <select id="fYear"></select><svg class="select__caret"><use href="#i-chev-down"/></svg>
          </div>
          <div class="select">
            <label for="fPriceMin" data-i18n="catalog.priceFrom"></label>
            <input type="number" id="fPriceMin" min="0" step="1000" placeholder="0" inputmode="numeric">
          </div>
          <div class="select">
            <label for="fPriceMax" data-i18n="catalog.priceTo"></label>
            <input type="number" id="fPriceMax" min="0" step="1000" placeholder="250000" inputmode="numeric">
          </div>
          <div class="select">
            <label for="fMileage" data-i18n="catalog.mileageTo"></label>
            <select id="fMileage"></select><svg class="select__caret"><use href="#i-chev-down"/></svg>
          </div>

          <div class="filters__actions">
            <button class="btn btn--ghost btn--sm" id="filtersReset" type="button" data-i18n="catalog.reset"></button>
            <button class="btn btn--primary btn--sm" id="filtersDone" type="button">
              <span data-i18n="catalog.filtersFound"></span>
              <b id="filtersDoneCount">0</b>
            </button>
          </div>
        </div>
      </div>

      <div class="chips" id="chips"></div>

      <div class="toolbar">
        <div class="toolbar__count">
          <b id="foundCount">0</b>
          <span data-i18n="catalog.found"></span>
          <span data-i18n="catalog.cars"></span>
        </div>
        <div class="toolbar__count" id="showingInfo"></div>
      </div>

      <div class="grid" id="grid"></div>

      <div class="empty" id="empty" hidden>
        <svg><use href="#i-sad"/></svg>
        <h3 data-i18n="catalog.empty"></h3>
        <p data-i18n="catalog.emptyHint"></p>
        <button class="btn btn--ghost" id="emptyReset" data-i18n="catalog.reset"></button>
      </div>

      <div class="more" id="more" hidden>
        <div class="more__line"></div>
        <button class="more__btn" id="moreBtn" type="button">
          <svg><use href="#i-arrow-down"/></svg>
        </button>
        <span class="more__label" id="moreLabel"></span>
        <span class="more__hint" id="moreHint"></span>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/cars-ui.js"></script>
<script src="assets/js/catalog.js"></script>
</body>
</html>
