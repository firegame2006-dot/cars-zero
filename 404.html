<style>
  :root { color-scheme: only light; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    min-height: 100dvh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(900px 520px at 50% -10%, #eadfcb 0%, transparent 70%),
      #fcfaf6;
    color: #1e1a14;
    font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
    line-height: 1.6;
    text-align: center;
  }
  .mark {
    width: 56px; height: 56px;
    margin: 0 auto 22px;
    border-radius: 50%;
    background: #9c6b33;
    color: #fff;
    display: grid;
    place-items: center;
    font-family: 'Inter Tight', sans-serif;
    font-weight: 700;
    font-size: 1.5rem;
  }
  h1 {
    font-family: 'Inter Tight', 'Inter', sans-serif;
    font-size: clamp(1.6rem, 6vw, 2.4rem);
    line-height: 1.15;
    margin: 0 0 10px;
  }
  p { margin: 0 0 28px; color: #574f43; max-width: 42ch; }
  .row { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 13px 26px;
    border-radius: 999px;
    border: 1px solid transparent;
    font-weight: 600;
    text-decoration: none;
    transition: background .2s, border-color .2s, color .2s;
  }
  .primary { background: #1e1a14; color: #fdfbf7; }
  .primary:hover { background: #9c6b33; }
  .ghost { border-color: #d8caaf; color: #1e1a14; background: rgba(255,255,255,.6); }
  .ghost:hover { border-color: #9c6b33; color: #9c6b33; }
</style>

<body>
  <main>
    <div class="mark">V</div>

    <div class="row">
      <a class="primary" href="/index.html">Back to home</a>

    </div>
