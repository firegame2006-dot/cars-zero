<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n-doc="meta.service">СТО — Velora Motors</title>
<meta name="description" data-i18n-doc="page.serviceLead" content="СТО Velora Motors">
<meta name="theme-color" content="#fcfaf6">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='15' fill='%239c6b33'/><text x='16' y='21' font-size='15' font-family='Arial' font-weight='bold' text-anchor='middle' fill='%23fff'>V</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

<main>
  <section class="pagehead">
    <div class="wrap">
      <nav class="crumbs">
        <a href="index.html" data-i18n="nav.home"></a>
        <span>/</span>
        <span data-i18n="nav.service"></span>
      </nav>
      <span class="eyebrow" data-i18n="sto.eyebrow"></span>
      <h1 class="pagehead__title" data-i18n="sto.title"></h1>
      <p class="lead" data-i18n="page.serviceLead"></p>
    </div>
  </section>

  <section class="section section--flat sto">
    <div class="wrap">
      <div class="sto__grid">
        <div class="services" id="services"></div>

        <form class="booking reveal" id="bookingForm">
          <h2 data-i18n="sto.formTitle"></h2>
          <p data-i18n="sto.formLead"></p>
          <div class="form-row">
            <label for="bName" data-i18n="sto.fName"></label>
            <input id="bName" name="name" type="text" autocomplete="name">
          </div>
          <div class="form-row">
            <label for="bPhone" data-i18n="sto.fPhone"></label>
            <input id="bPhone" name="phone" type="tel" placeholder="+380 __ ___ __ __" autocomplete="tel">
          </div>
          <div class="form-row">
            <label for="bCar" data-i18n="sto.fCar"></label>
            <input id="bCar" name="car" type="text">
          </div>
          <div class="form-row">
            <label for="bService" data-i18n="sto.fService"></label>
            <select id="bService" name="service"></select>
          </div>
          <div class="form-row">
            <label for="bComment" data-i18n="sto.fComment"></label>
            <textarea id="bComment" name="comment" rows="2"></textarea>
          </div>
          <button class="btn btn--light btn--block" type="submit" data-i18n="sto.submit"></button>
          <div class="form-msg" id="bookingMsg" role="status"></div>
        </form>
      </div>
    </div>
  </section>

  <section class="section section--tint">
    <div class="wrap">
      <div class="section-head reveal">
        <div class="section-head__text">
          <span class="eyebrow" data-i18n="about.eyebrow"></span>
          <h2 class="section-title" data-i18n="about.title"></h2>
          <p class="lead" data-i18n="about.lead"></p>
        </div>
      </div>
      <div class="about__grid reveal">
        <article class="about__card" data-demo="note" role="button" tabindex="0">
          <div class="about__num">01</div>
          <h3 data-i18n="about.a1t"></h3>
          <p data-i18n="about.a1d"></p>
        </article>
        <article class="about__card" data-demo="note" role="button" tabindex="0">
          <div class="about__num">02</div>
          <h3 data-i18n="about.a2t"></h3>
          <p data-i18n="about.a2d"></p>
        </article>
        <article class="about__card" data-demo="note" role="button" tabindex="0">
          <div class="about__num">03</div>
          <h3 data-i18n="about.a3t"></h3>
          <p data-i18n="about.a3d"></p>
        </article>
        <article class="about__card" data-demo="note" role="button" tabindex="0">
          <div class="about__num">04</div>
          <h3 data-i18n="about.a4t"></h3>
          <p data-i18n="about.a4d"></p>
        </article>
      </div>
    </div>
  </section>
</main>

<script src="assets/js/i18n.js"></script>
<script src="assets/js/seed.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/cars-ui.js"></script>
<script src="assets/js/showcase-data.js"></script>
<script src="assets/js/service.js"></script>
</body>
</html>
